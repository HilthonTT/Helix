name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/Helix.App/Helix.App.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -p:RuntimeIdentifierOverride=${{ matrix.rid }}
          -p:AppxPackageSigningEnabled=false
          -o publish/${{ matrix.rid }}

      - name: Create archive
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath "artifacts/Helix-$tag-${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Helix-${{ matrix.rid }}
          path: artifacts/*.zip
          if-no-files-found: error

  publish-macos:
    name: Publish maccatalyst
    runs-on: macos-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Publish (maccatalyst)
        run: >
          dotnet publish src/Helix.App/Helix.App.csproj
          -f net10.0-maccatalyst
          -c Release
          -p:CreatePackage=false
          -p:EnableCodeSigning=false

      - name: Create archive
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi

          BIN="src/Helix.App/bin/Release/net10.0-maccatalyst"

          APP="$(find "$BIN" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            APP="$(find "$BIN" -maxdepth 2 -type d -name '*.app' -print -quit)"
          fi

          if [ -z "$APP" ]; then
            echo "No .app bundle was produced. $BIN holds:"
            find "$BIN" -maxdepth 2 -print | head -50
            exit 1
          fi

          echo "Archiving $APP"
          file "$APP/Contents/MacOS/"* | head -5

          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" "artifacts/Helix-$TAG-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Helix-macos
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [publish, publish-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # GitHub publishes a SHA-256 for every asset, but it publishes the asset too, so the
      # digest only proves the bytes arrived intact. The signature is the half that says
      # who built them: Helix checks it against a public key compiled into the app, and the
      # private half never leaves this secret. A release built without the secret is
      # published unsigned, which every build shipped before the key existed still accepts.
      #
      # One manifest for the whole release rather than a .sig beside each archive. Every
      # build published so far picks its download with Name.Contains("-win-x64.") and no
      # extension filter, so a file called Helix-<tag>-win-x64.zip.sig matches that
      # predicate and an existing install could be handed the signature as its update.
      # This name carries no moniker, so no released build can select it.
      - name: Sign the archives
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::warning::No RELEASE_SIGNING_KEY secret is set; this release will be published unsigned."
            exit 0
          fi

          printf '%s' "$SIGNING_KEY" > signing-key.pem
          trap 'rm -f signing-key.pem' EXIT

          manifest="artifacts/Helix-$TAG-signatures.txt"
          : > "$manifest"

          for archive in artifacts/*.zip; do
            openssl dgst -sha256 -sign signing-key.pem -out "$archive.der" "$archive"
            printf '%s %s\n' "$(basename "$archive")" "$(base64 -w0 "$archive.der")" >> "$manifest"
            rm -f "$archive.der"
            echo "Signed $(basename "$archive")"
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # The manifest is only there when the secret was, so the list is built from what
          # exists rather than from a glob the shell would hand over unexpanded.
          assets=(artifacts/*.zip artifacts/*-signatures.txt)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets."
            gh release upload "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
