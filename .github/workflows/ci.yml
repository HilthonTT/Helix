name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore Helix.sln

      - name: Build
        run: dotnet build Helix.sln --configuration Release --no-restore

      - name: Test (Application)
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Test (Infrastructure)
        run: dotnet test tests/Infrastructure.UnitTests/Infrastructure.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Test (Architecture)
        run: dotnet test tests/ArchitectureTests/ArchitectureTests.csproj --configuration Release --no-build --verbosity normal
