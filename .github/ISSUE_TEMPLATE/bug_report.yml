name: 🐛 Bug report
description: Something in Helix doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        ⚠️ **Do not include NAS credentials, passwords, IP addresses or the contents of a `.helixvault` file.**
        If you found a security vulnerability, please report it privately instead — see [SECURITY.md](https://github.com/HilthonTT/Helix/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Helix and log in
        2. Go to '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Helix version
      description: The release you are running, or the commit SHA if you built from source.
      placeholder: "v1.0.0 / 75983f2"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: "Run `winver` — e.g. Windows 11 Pro 24H2 (build 26100)."
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: How did you install Helix?
      options:
        - Published folder (dotnet publish / release download)
        - Built and run from Visual Studio
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, error messages or stack traces
      description: Paste any error dialog text or exception output. This will be rendered as code, no backticks needed.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: This report contains no credentials or other sensitive data.
          required: true
