name: ✨ Feature request
description: Suggest an idea or improvement for Helix.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Helix to do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have thought about.

  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Drive connections
        - Dashboard / status
        - Import & export (vault)
        - Audit logs
        - Users & authentication
        - Settings & startup
        - Localization
        - Other
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been requested yet.
          required: true
