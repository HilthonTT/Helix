<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140608"/>
      <stop offset=".55" stop-color="#0a0405"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d67"/>
      <stop offset=".5" stop-color="#f0193d"/>
      <stop offset="1" stop-color="#9e1028"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".78" cy=".18" r=".7">
      <stop offset="0" stop-color="#f0193d" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#c4142f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#620e1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx=".1" cy=".95" r=".6">
      <stop offset="0" stop-color="#620e1c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#620e1c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx=".6" cy=".35" r=".65">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="1500" fill="url(#gridFade)"/></mask>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#050505" stop-opacity="0"/><stop offset="1" stop-color="#050505" stop-opacity=".85"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#field)"/>
  <rect width="1200" height="1500" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="1500" fill="url(#bloom)"/>
  <rect width="1200" height="1500" fill="url(#ember)"/>

  <g filter="url(#soft)" opacity=".3">
    <path d="M-100 360C250 250 700 520 1300 300" stroke="#ff4d67" stroke-width="70" fill="none" opacity=".35"/>
    <path d="M-100 520C300 420 750 660 1300 470" stroke="#c4142f" stroke-width="80" fill="none" opacity=".3"/>
  </g>

  <g transform="translate(700 -60) rotate(18)" fill="none" stroke-linecap="round">
    <g stroke="url(#strand)" stroke-width="14" opacity=".3">
      <path d="M-95 -90h190M-112 0h224M-95 90h190M-95 430h190M-112 520h224M-95 610h190M-95 950h190M-112 1040h224M-95 1130h190M-95 1470h190M-112 1560h224M-95 1650h190"/>
    </g>
    <path d="M150 0C150 260-150 260-150 520S150 780 150 1040-150 1300-150 1560" stroke="url(#strand)" stroke-width="44" opacity=".45"/>
    <path d="M-150 0C-150 260 150 260 150 520S-150 780-150 1040 150 1300 150 1560" stroke="url(#strand)" stroke-width="44"/>
  </g>

  <rect width="1200" height="1500" fill="url(#foot)"/>
</svg>
