<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sign-in panel artwork.

  Hand-authored rather than traced: the previous file was a bitmap run through an
  auto-vectoriser, which left 892 ragged paths whose stair-stepped edges survived
  any rasterisation size. These are smooth Béziers, so the panel stays clean at any
  resolution. Portrait, because the panel is taller than it is wide and a landscape
  source loses most of its width to the AspectFill crop.

  Palette matches the original: #F57829 / #F25E27 field, #242232 sweep.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="1500" viewBox="0 0 1200 1500">

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9913C"/>
      <stop offset="0.45" stop-color="#F57829"/>
      <stop offset="1" stop-color="#EE5524"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#1D1B2A"/>
      <stop offset="1" stop-color="#2E2B41"/>
    </linearGradient>

    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFC212" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC212" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#field)"/>

  <!-- Warm bloom behind the upper field -->
  <ellipse cx="980" cy="120" rx="820" ry="520" fill="url(#glow)"/>

  <!-- Concentric arcs, echoing the logomark's rings -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.13">
    <circle cx="1180" cy="-160" r="620" stroke-width="3"/>
    <circle cx="1180" cy="-160" r="790" stroke-width="3"/>
    <circle cx="1180" cy="-160" r="960" stroke-width="2"/>
    <circle cx="1180" cy="-160" r="1130" stroke-width="2"/>
  </g>

  <!-- The dark sweep: one crescent, thicker through the middle -->
  <path fill="url(#sweep)"
        d="M -80 596
           C 210 806, 560 916, 1280 452
           L 1280 690
           C 560 1176, 210 1010, -80 810
           Z"/>

  <!-- A thin highlight riding the crest of the sweep -->
  <path fill="none" stroke="#FFC212" stroke-opacity="0.30" stroke-width="3"
        d="M -80 596 C 210 806, 560 916, 1280 452"/>

  <!-- Grounding shadow at the foot of the panel -->
  <path fill="#242232" fill-opacity="0.16"
        d="M -80 1290 C 300 1180, 780 1330, 1280 1214 L 1280 1560 L -80 1560 Z"/>

</svg>
